<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行程地图</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand"><b>↗</b> 行程地图</div><div class="intro"><h1>导入行程表</h1><p>选择 XLSX 文件和工作表，生成铁路及飞行轨迹。</p></div><label class="drop" id="drop"><span class="upload">↥</span><strong>导入你的行程</strong><span>拖放 XLSX 文件，或点击选择</span><small>按列名识别 · 支持多工作表 · 本地读取</small><input id="file" type="file" accept=".xlsx,.xls" hidden></label><div class="fileline"><button id="template">↓ 下载空白模板</button><button id="help">格式说明 ↗</button></div><label style="font-size:11px;margin-bottom:12px">铁路线路依据 <select id="routing"><option value="timetable">历史停站 + 铁路专用寻路</option><option value="network">铁路专用寻路（不查时刻表）</option><option value="overpass">备用：Overpass 本地寻路</option></select></label><button id="archive" style="margin-bottom:10px">缓存导入车次的历年时刻表</button><div id="sheetBox" hidden><label>选择工作表 <select id="sheet"></select></label></div><div class="section"><h3>我的行程 <span id="count">0</span></h3><select id="filter"><option value="all">全部行程</option><option value="rail">铁路</option><option value="air">飞行</option><option value="error">待处理</option></select></div><input id="search" placeholder="搜索车站、机场或班次" aria-label="搜索行程"><div id="list"><div class="empty"><span>⌁</span><h3>暂无行程</h3><p>导入后显示行程与匹配结果。</p></div></div><div class="bottom"><span class="dot"></span> OSM 开放地图与铁路网络 <button id="clear">清空</button></div></aside><main><header><div><h2>我的旅行地图</h2></div><div class="actions"><button id="fit">⌖ 全部轨迹</button><button id="export">↓ GeoJSON</button></div></header><div id="map"></div><div class="stats"><div><span>行程记录</span><b id="total">0<small> 段</small></b></div><div><span>已生成轨迹</span><b id="done">0<small> 段</small></b></div><div><span>表内累计里程</span><b id="distance">—<small> km</small></b></div></div><div class="legend"><span><i></i> 铁路 · OSM 网络推算</span><span><i class="air"></i> 飞行 · 椭圆弧线</span></div><div class="workbar"><span id="status">等待导入行程 · 你的表格仅在此浏览器处理</span><button id="run" class="primary" disabled>生成轨迹 ↗</button><button id="stop" hidden>停止</button></div></main><dialog id="dialog"><button id="close" class="close">×</button><div id="detail"></div></dialog><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.a7e7c1775be7.bundle.js"></script></body></html>
