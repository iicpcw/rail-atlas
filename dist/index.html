<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行程地图</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head><body><aside id="sidebar"><div class="sidebar-scroll"><div class="brand"><b>↗</b> 行程地图</div><div class="stats"><div><span>行程记录</span><b id="total">0<small> 段</small></b></div><div><span>已生成轨迹</span><b id="done">0<small> 段</small></b></div><div><span>表内累计里程</span><b id="distance">—<small> km</small></b></div></div><div class="intro"><h1>导入行程表</h1><p>导入表格或手动填写，生成铁路及飞行轨迹。</p></div><label class="drop" id="drop"><span class="upload">↥</span><strong>导入你的行程</strong><span>拖放 XLSX 文件，或点击选择</span><small>按列名识别 · 支持多工作表 · 本地读取</small><input id="file" type="file" accept=".xlsx,.xls" hidden></label><button id="addTrip" class="manual-add">手动添加行程</button><div class="fileline"><button id="template">↓ 下载空白模板</button><button id="help">格式说明 ↗</button></div><label style="font-size:11px;margin-bottom:12px">铁路线路依据 <select id="routing"><option value="timetable">历史停站 + 铁路专用寻路</option><option value="network">铁路专用寻路（不查时刻表）</option><option value="overpass">备用：Overpass 本地寻路</option></select></label><button id="cacheInfo" style="margin-bottom:10px">查看本站时刻表缓存</button><button id="archive" style="margin-bottom:10px">下载导入车次到本机</button><div id="sheetBox" hidden><label>选择工作表 <select id="sheet"></select></label></div><details id="calendarPanel" class="calendar-panel" open hidden><summary>行程日历 <span id="calendarSelection">全部日期</span></summary><div class="calendar-tools"><button id="calendarPrev" aria-label="上一个有行程的月份">‹</button><select id="calendarMonth" aria-label="行程月份"></select><button id="calendarNext" aria-label="下一个有行程的月份">›</button></div><div class="calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendarDays" class="calendar-grid" aria-label="选择行程日期"></div><div class="calendar-reset"><button id="calendarAll">全部日期</button><button id="calendarUnknown">无日期行程</button></div><small>灰色日期无行程 · 跨日行程显示于所覆盖日期</small></details><div class="section"><h3>我的行程 <span id="count">0</span></h3><select id="filter"><option value="all">全部行程</option><option value="rail">铁路</option><option value="air">飞行</option><option value="error">待处理</option></select></div><input id="search" placeholder="搜索车站、机场或班次" aria-label="搜索行程"><div class="selection-tools"><button id="selectAll">全选</button><button id="selectNone">全不选</button><span>勾选显示轨迹</span></div><div id="list"><div class="empty"><span>⌁</span><h3>暂无行程</h3><p>导入后显示行程与匹配结果。</p></div></div><div class="bottom"><span class="dot"></span> OSM 开放地图与铁路网络 <button id="clear">清空</button></div></div><div class="workbar"><span id="status">等待导入行程 · 你的表格仅在此浏览器处理</span><button id="run" class="primary" disabled>生成全部</button><button id="runSelected" disabled>生成勾选</button><button id="runRail" disabled>仅生成铁路</button><button id="runAir" disabled>仅生成航空</button><button id="stop" hidden>停止</button></div><div class="actions sidebar-actions"><button id="fit">全部轨迹</button><button id="share">分享图片</button><button id="export">GeoJSON</button></div></aside><main><button id="toggleSidebar" aria-controls="sidebar" aria-expanded="true" title="收起或展开侧栏">☰</button><div id="map"></div><div class="legend"><span><i></i> 铁路</span><span><i class="air"></i> 飞行 · ● 机场</span></div><footer class="site-footer"><a href="https://github.com/iicpcw/rail-atlas" target="_blank" rel="noopener noreferrer">GitHub 仓库</a><span id="busuanzi_container_site_uv">访客 <span id="busuanzi_value_site_uv">—</span></span><span id="busuanzi_container_page_pv">访问 <span id="busuanzi_value_page_pv">—</span></span><small>计数：不蒜子</small></footer></main><dialog id="dialog"><button id="close" class="close">×</button><div id="detail"></div></dialog><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="app.e2276c195070.bundle.js"></script></body></html>
