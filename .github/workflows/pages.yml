name: Check and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build versioned application bundle
        run: node scripts/build.mjs
      - name: Check JavaScript and route edge cases
        run: |
          for file in dist/*.js; do node --check "$file"; done
          node tests/edge-cases.cjs
          node tests/services.cjs
          node tests/history-cache.cjs
          node tests/timetable-cache.cjs
          node tests/batched-routing.cjs
          node tests/bundle.cjs
          node tests/automatic-repair.cjs
          node tests/station-cache.cjs
          node tests/manual-entry.cjs
          node tests/routing-quality.cjs
          node tests/rail-service.cjs
          node tests/calendar.cjs
          node tests/mainline.cjs
          node tests/bulk-cache.cjs
          node tests/selection.cjs
          node tests/http-errors.cjs
          node test-generation.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          echo 'Pages artifact metadata did not become available'
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
