name: Check and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build versioned application bundle
        run: node scripts/build.mjs
      - name: Check JavaScript and route edge cases
        run: |
          for file in dist/*.js; do node --check "$file"; done
          node tests/edge-cases.cjs
          node tests/services.cjs
          node tests/history-cache.cjs
          node tests/batched-routing.cjs
          node tests/bundle.cjs
          node tests/rail-service.cjs
          node test-generation.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
